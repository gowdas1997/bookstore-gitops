apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-service
  namespace: bookstore
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: user-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: book-service
  namespace: bookstore
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: book-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service
  namespace: bookstore
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: order-service
