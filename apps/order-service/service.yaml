apiVersion: v1
kind: Service
metadata:
  name: order-service
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /api/orders/health
  namespace: bookstore
  labels:
    app: order-service
    app.kubernetes.io/part-of: bookstore
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 8000
      targetPort: http
