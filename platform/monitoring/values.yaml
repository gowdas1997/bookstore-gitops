fullnameOverride: kps

crds:
  enabled: true

# EKS control plane metrics are not exposed, disable to avoid false "target down" alerts
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  # Helm hook Jobs (kps-admission-create/patch) race with Argo CD, so run without admission webhooks
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: 8GB
    resources:
      requests: {cpu: 200m, memory: 800Mi}
      limits: {memory: 1500Mi}
    # pick up ServiceMonitors/PodMonitors/rules from any namespace (bookstore later)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    configSecret: alertmanager-email-config
    replicas: 1
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 128Mi}
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    type: pvc
    storageClassName: gp3
    accessModes: ["ReadWriteOnce"]
    size: 2Gi
  # RWO volume: avoid two pods fighting for the same EBS disk during rollout
  deploymentStrategy:
    type: Recreate
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
  grafana.ini:
    server:
      domain: grafana.sudarshangowda.online
      root_url: https://grafana.sudarshangowda.online/
    security:
      cookie_secure: true
      disable_gravatar: true
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/load-balancer-name: grafana-internal-alb
      alb.ingress.kubernetes.io/scheme: internal
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
      alb.ingress.kubernetes.io/security-groups: sg-011deb037672b8214
      alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
      alb.ingress.kubernetes.io/tags: Project=bookstore,Environment=prod,Component=monitoring
    hosts:
      - grafana.sudarshangowda.online
    path: /
    pathType: Prefix

additionalPrometheusRulesMap:
  bookstore-rules:
    groups:
      - name: bookstore.rules
        rules:
          - alert: BookstorePodNotReady
            expr: kube_pod_status_ready{namespace="bookstore",condition="true"} == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "A bookstore pod has not been Ready for 5 minutes"
          - alert: BookstorePodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total{namespace="bookstore"}[15m]) > 3
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "A bookstore container restarted more than 3 times in 15 minutes"
          - alert: BookstoreContainerOOMKilled
            expr: kube_pod_container_status_last_terminated_reason{namespace="bookstore",reason="OOMKilled"} == 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "A bookstore container was OOMKilled - raise its memory limit"
          - alert: BookstoreDeploymentReplicasMismatch
            expr: kube_deployment_status_replicas_available{namespace="bookstore"} < kube_deployment_spec_replicas{namespace="bookstore"}
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "A bookstore deployment has fewer available replicas than desired"

# 2-node lab cluster cannot tolerate a node failure by design (CPU requests > 50% of allocatable).
# Production would add nodes instead of disabling. Revisit when node count grows.
defaultRules:
  disabled:
    KubeCPUOvercommit: true
