fullnameOverride: kps

crds:
  enabled: true

# EKS control plane metrics are not exposed, disable to avoid false "target down" alerts
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: 8GB
    resources:
      requests: {cpu: 200m, memory: 800Mi}
      limits: {memory: 1500Mi}
    # pick up ServiceMonitors/PodMonitors/rules from any namespace (bookstore later)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 128Mi}
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    type: pvc
    storageClassName: gp3
    accessModes: ["ReadWriteOnce"]
    size: 2Gi
  # RWO volume: avoid two pods fighting for the same EBS disk during rollout
  deploymentStrategy:
    type: Recreate
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
  grafana.ini:
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
