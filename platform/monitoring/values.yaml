fullnameOverride: kps

crds:
  enabled: true

# EKS control plane metrics are not exposed, disable to avoid false "target down" alerts
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  # Helm hook Jobs (kps-admission-create/patch) race with Argo CD, so run without admission webhooks
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: 8GB
    resources:
      requests: {cpu: 200m, memory: 800Mi}
      limits: {memory: 1500Mi}
    # pick up ServiceMonitors/PodMonitors/rules from any namespace (bookstore later)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 128Mi}
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    type: pvc
    storageClassName: gp3
    accessModes: ["ReadWriteOnce"]
    size: 2Gi
  # RWO volume: avoid two pods fighting for the same EBS disk during rollout
  deploymentStrategy:
    type: Recreate
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
  grafana.ini:
    server:
      domain: grafana.sudarshangowda.online
      root_url: https://grafana.sudarshangowda.online/
    security:
      cookie_secure: true
      disable_gravatar: true
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/load-balancer-name: grafana-internal-alb
      alb.ingress.kubernetes.io/scheme: internal
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
      alb.ingress.kubernetes.io/security-groups: sg-011deb037672b8214
      alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
      alb.ingress.kubernetes.io/tags: Project=bookstore,Environment=prod,Component=monitoring
    hosts:
      - grafana.sudarshangowda.online
    path: /
    pathType: Prefix
